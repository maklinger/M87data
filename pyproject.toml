[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "M87data"
version = "1.0.12"
description = "Various M87 data and python snippets for plotting it"
readme = "README.md"
requires-python = ">=3.8"


[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
M87data = ["data/**/*"]
